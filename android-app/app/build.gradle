plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sjzkq.harmonica'
    compileSdk 34

    defaultConfig {
        applicationId "com.sjzkq.harmonica"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯原生Android，无第三方依赖
}
